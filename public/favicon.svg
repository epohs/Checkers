<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<style>
  .bg { fill: #c93d28; }
  .disc { fill: #f4f2ea; }
  .ridge { fill: none; stroke: #c93d28; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #9e2f1c; }
    .disc { fill: #e9e4d6; }
    .ridge { stroke: #9e2f1c; }
  }
</style>
<rect class="bg" width="100" height="100" rx="22"/>
<!-- A checker seen from above: the disc and its raised inner ridge. -->
<circle class="disc" cx="50" cy="50" r="35"/>
<circle class="ridge" cx="50" cy="50" r="22" stroke-width="6.5"/>
</svg>
